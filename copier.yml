# Copier configuration.

_min_copier_version: "9.4.0"
_subdirectory: template
_message_after_copy: |
    Your project template has been copied!

    Remember to look for any unfilled `changeme` strings and confirm the license!
    By default this template uses MIT license.

    Next steps:

    cd {{ _copier_conf.dst_path | basename }}
    git init
    git add .
    git commit -m "Initial commit from simple-modern-uv."
    # Create repo on GitHub, then:
    git remote add origin git@github.com:{{ package_github_org }}/{{ package_name }}.git
    git branch -M main
    git push -u origin main

package_name:
    type: str
    help: What is the project name? (This will be the GitHub repo name, so use CamelCase, dash-case, or snake_case. This is the only required field.)
    default: changeme

package_description:
    type: str
    help: Project description? (Press enter to fill in later.)
    default: changeme

package_author_name:
    type: str
    help: Package author name? (Press enter to fill in later.)
    default: changeme

package_author_email:
    type: str
    help: Package author email? (Press enter to fill in later.)
    default: changeme@example.com

package_github_org:
    type: str
    help: Package GitHub org or username? (Press enter to fill in later.)
    default: changeme
